---
name: "Cookies de Halloween"
category: "Goûters"
meta:
 preparationtime: "30 minutes"
 waitingtime: "15 minutes"
 bakingtime: "15 minutes"
 portion: "30 petits cookies"
tags:
source: "cookingwithflora.com"
image: ""
ingredients:
 - "280 g de farine"
 - "1 cuil. à café de levure chimique"
 - "1/2 cuil. à café de sel"
 - "1 cuil. à café de cannelle"
 - "1/2 cuil. à café de curcuma"
 - "1/2 cuil. à café de noix de muscade moulue"
 - "1/4 cuil. à café de clous de girofle moulus "
 - "110 g de beurre"
 - "30 g de sucre complet"
 - "1 gros œuf"
 - "2 cuil. à soupe de lait"
 - "2 cuil. à soupe de purée d'amandes"
 - "250g de courge"
steps:
 - "Préchauffez le four à 175°C (oui bon, c'est une recette américaine qui demande 350°F, mais personne ne sera choqué si vous mettez 180°C à la place)."
 - "Cuissez la courge en petits dés dans de l'eau et écrasez là en purée."
 - "Dans un bol, mélangez ensemble la farine la levure chimique le sel et les épices. Préservez de côté."
 - "Dans un autre bol, mélangez le beurre et le sucre jusqu'à ce que le mélange mousse un peu (au fouet ou au batteur électrique)."
 - "Intégrez l'œuf tout en continuant à mélanger, puis faites de même avec le lait et la purée de courge."
 - "Ajoutez peu à peu les ingrédients sec en mixant à faible vitesse jusqu'à ce que vous obteniez une pate molle."
 - "Faites des boules de 3 cm de diamètres et applatissez les sur une plaque de cuisson."
 - "Mettez à cuir pour 10-12 minutes jusqu'à ce que les cookies dorent légèrement."
 - "Laissez les cookies refroidir 5 minutes avant de les déplacer sur une grille pour qu'ils finissent de refroidir."
hints:
