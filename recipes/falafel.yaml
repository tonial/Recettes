---
name: "Falafels"
category: "Plats Chauds"
meta:
 preparationtime: "30 minutes"
 waitingtime: "24h"
 bakingtime: "20"
 portion: "8 personnes"
tags:
source: "www.papillesetpupilles.fr"
image: ""
ingredients:
 - "700g de pois chiches secs"
 - "1 gros oignon jaune"
 - "1 botte de persil plat"
 - "10 brins de menthe"
 - "1 cuil. à café de cardamome verte"
 - "2 cuil. à café de cumin"
 - "4 gousses d'ail"
 - "2 cuil. à café de sel"
 - "4 tours de moulin de poivre noir"
 - "2 sachets de levure chimique"
 - "3 cuil. à soupe de farine de blé"
steps:
 - "Mettez à tremper les pois chiches dans un grand volume d'eau avec une cuillère à soupe de bicarbonate de soude pour 24h. Vous pouvez changer l'eau au bout de 12h."
 - "Pelez de coupez grossièrement l'oignon. Hachez grossièrement les herbes et l'ail."
 - "Dans le bol d'un robot mettez les pois chiches, l'oignon, les herbes, l'ail, les epices, le sel et le poivre. Si le robot n'est pas assez grand, faite le en plusieurs fois."
 - "Mixez jusqu'à obtenir une texture granuleuse entre purée épaisse et semoule."
 - "Versez la préparation dans un saladier. Ajoutez la farine et la levure et mélangez."
 - "Laissez reposer une heure au réfrigérateur. Cela permet à la pate de se raffermir et facilite le façonnage."
 - "Utilisez idéalement une cuillère à falafel (ou à défaut une cuillère à glace ou vos main) pour façonner les falafels, puis faites les cuire à la friteuse quelques minutes."
hints:
