ingredients:
 - "250 g de farine"
 - "50 g de sucre"
 - "200 g de yaourt"
 - "70 g d'huile"
 - "3 œufs"
 - "1 sachet de levure chimique"
 - "100g de chocolat noir 70%"
 - "20g de beurre"
 - "20g de lait"
