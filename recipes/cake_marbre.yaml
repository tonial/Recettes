steps:
 - "Faites préchauffer le four à 150°C"
 - "Dans un récipient mélangez les ingrédients du yaourt à la levure jusqu'à obtention d'une pâte homogène."
 - "versez 420 g de pâte dans un second bol et ajoutez l'extrait de vanille."
 - "Faites fondre le chocolat et le beurre et le lait en mélangeant bien, puis incorporez au premier bol."
 - "Dans le moule à cake, versez alternativement de la pâte au chocolat et de la pâte à la vanille, puis enfournez pour 40 minutes."
