---
name: "Tarte courgettes tofu rosso"
category: "Plats Chauds"
meta:
 preparationtime: "30 minutes"
 waitingtime: ""
 bakingtime: "40 minutes"
 portion: "4 personnes"
tags:
source: ""
image: ""
ingredients:
 - "1 pâte à tarte"
 - "2 courgettes (500 g)"
 - "200 g de tofu rosso"
 - "20 cl de crème de soja"
 - "3 œufs"
 - "20 g parmesan"
 - "1 belle tomate"
 - "1 pincée de sel"
 - "Quelques feuilles de basilic"
steps:
 - "Préchauffez le four à 180°C chaleur tournante."
 - "Coupez les courgettes en fines lamelles à l'aide d'une mandoline. puis faites les cuire à la poêle à feu moyen pour ne pas les caraméliser."
 - "Mettez la pâte dans un moule à tarte de 26 cm de diamètre."
 - "Dans un bol, émiettez le tofu à la fourchette, puis ajoutez les œufs, la crème de soja et le sel. Mélangez bien."
 - "Ajoutez les courgettes cuites au mélange une fois qu'elles sont cuites, puis versez le tout dans la pâte."
 - "Disposez de fines tranches de tomate sur l'appareil, et râpez le parmesan dessus."
 - "Enfournez pour 40 minutes."
hints:
